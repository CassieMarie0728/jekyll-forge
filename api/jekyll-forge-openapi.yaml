openapi: 3.0.3
info:
  title: Jekyll Forge API
  version: 1.0.0
  description: 'OpenAPI map generated from the Jekyll Forge tRPC server source. Query procedures use GET with tRPC input in the `input` query parameter; mutations use POST with a `{ "json": ... }` body. Protected procedures accept the application session/authentication mechanism.'
servers:
- url: http://localhost:3000
  description: Development
- url: https://jekyll-forge.manus.space
  description: Production (source-configured; verify before deployment)
tags:
- name: Ab Testing
- name: Ai
- name: Ai Providers
- name: Assets
- name: Auth
- name: Blocks
- name: Github
- name: Notifications
- name: Posts
- name: Repurposing
- name: Scheduler
- name: Sites
- name: Snapshots
- name: Social Media
