    post:
      tags:
      - Ab Testing
      summary: Apply Winner
      operationId: abTesting_applyWinner
      responses:
        '200':
          description: Successful tRPC response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TRPCResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                json:
                  type: object
                  properties:
                    postId:
                      type: number
                    winningVariationIndex:
                      type: number
                  required:
                  - postId
                  - winningVariationIndex
              required:
              - json
